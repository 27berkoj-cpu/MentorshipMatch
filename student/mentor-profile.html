<!--mentor-profile.html should not be a page that permanently shows one specific mentor. It should be a dynamic template that displays whichever mentor the student selects.

Think of it like Amazon: the product page is the same HTML structure, but the information changes depending on which product you clicked.

How it would work

The flow would be:

student/mentors.html
        ↓
Student sees MANY mentors
        ↓
Clicks "View Profile" on one mentor
        ↓
mentor-profile.html?id=27
        ↓
JavaScript reads the ID (27)
        ↓
Requests mentor #27 from the backend
        ↓
Backend gets mentor #27 from database
        ↓
Page displays that mentor's information

So your mentors.html might visually look like:

┌──────────────────────────────────────────────────────┐
│                 Find a Mentor                        │
│                                                      │

│                                                      │

mentor-profile.html?id=73

the exact same HTML page displays Mike's information.

So what actually changes?

Your HTML is mostly a skeleton:

<h1 id="mentor-name"></h1>
<p id="mentor-profession"></p>
<p id="mentor-bio"></p>

Then mentors.js or mentor-profile.js gets the appropriate mentor:

Database
   ↓
Mentor #73
   ↓
Node/Express API
   ↓
JavaScript
   ↓
HTML elements

For example, the database might contain:

mentor_id: 73
name: Mike Davis
profession: UX Designer
bio: ...
rating: 4.7

JavaScript then puts those values into the page. -->
